<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дрон с лекарствами</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* чтобы занять всю высоту экрана */
      /* background: linear-gradient(135deg, #e3f2fd, #bbdefb); */
      font-family: monospace;
      overflow: hidden;
      color: #000;
    }

    .game-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      /* display: block; */
      margin: 40px auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      border-radius: 8px;
      border: 2px solid #000000;
      display: flex;
      justify-content: center;
    }

    #introScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
      flex-direction: column;
      backdrop-filter: blur(4px);
      text-align: center;
    }
    #introScreen h1 {
      font-size: 42px;
      margin: 0 0 10px 0;
      color: #f3219c;
    }
    #introScreen p {
      font-size: 20px;
      color: #555;
      max-width: 600px;
      line-height: 1.5;
    }

    .game-over-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.95);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }
    .game-over-screen h1 {
      font-size: 65px;
      margin: 0 0 10px 0;
      color: #000000;
    }
    .game-over-screen.lose h1 { color: #dc3545; }
    .game-over-screen p {
      font-size: 20px;
      color: #333;
      margin: 10px 0;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      transition: all 0.2s;
    }
    #nextBtn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background: #f3219c;
      color: #fff;
      border: none;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      font-family: sans-serif;
    }
    #nextBtn:hover {
       background: #ff1493; 
      }

    #retryBtn {
      background: #6c757d;
      color: white;
    }
    #retryBtn:hover { background: #5a6268; }
  </style>
</head>
<body>

  <div id="introScreen">
    <h1>Это первый уровень</h1>
    <p>Ваша задача: доставить лекарства к курьеру.<br>
       Используйте стрелки для управления.<br>
       Нажмите любую клавишу, чтобы начать.</p>
  </div>

    <div class="game-container">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

  <div id="winScreen" class="game-over-screen">
    <h1>Молодец!</h1>
    <p>Вы успешно доставили лекарства.</p>
    <a href="level2.html" id="nextBtn" class="nextBtn">Дальше</a>
  </div>

  <div id="loseScreen" class="game-over-screen lose">
    <h1>Поражение</h1>
    <p>Птицы поймали сигнал! Игра окончена.</p>
    <button id="retryBtn">Ещё раз</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const introScreen = document.getElementById('introScreen');
    const winScreen = document.getElementById('winScreen');
    const loseScreen = document.getElementById('loseScreen');
    const retryBtn = document.getElementById('retryBtn');

    let gameOver = false;
    let hits = 0;
    const maxHits = 3;
    let gameRunning = false; // добавляем переменную для контроля запуска

    const signal = {
      x: 50,
      y: 550,
      width: 40,
      height: 40,
      color: 'orange',
      speed: 5
    };

    // Картинки
    const droneImage = new Image();
    droneImage.src = 'image/1111.png';
    const courierImage = new Image();
    courierImage.src = 'image/1111.png';
    const birdImage = new Image();
    birdImage.src = 'image/2222.png';

    const signalImage = new Image();
    signalImage.src = 'image/444.png';

    const courier = {
      x: 670,
      y: 370,
      width: 110,
      height: 110
    };

    const birds = [];
    const birdCount = 7;
    for (let i = 0; i < birdCount; i++) {
      birds.push({
        x: Math.random() * 700 + 50,
        y: Math.random() * 200 + 50,
        width: 80,
        height: 70,
        speedX: (Math.random() - 0.5) * 2,
        speedY: (Math.random() - 0.5) * 2
      });
    }

    const keys = {};

    // Обработка нажатия любой клавиши, чтобы начать игру
window.addEventListener('keydown', (e) => {
  if (introScreen.style.display !== 'none' && !gameRunning) {
    startGame();
  }
  // Можно оставить для управления стрелками
  keys[e.key] = true;
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

function startGame() {
  introScreen.style.display = 'none';
  winScreen.style.display = 'none';
  loseScreen.style.display = 'none';

  hits = 0;
  gameOver = false;
  gameRunning = true; // запуск игры

  let imagesLoaded = 0;
  const totalImages = 4;

  function checkReady() {
    imagesLoaded++;
    if (imagesLoaded === totalImages) {
      gameLoop();
    }
  }

  droneImage.onload = checkReady;
  courierImage.onload = checkReady;
  birdImage.onload = checkReady;
  signalImage.onload = checkReady;

  if (droneImage.complete) checkReady();
  if (courierImage.complete) checkReady();
  if (birdImage.complete) checkReady();
  if (signalImage.complete) checkReady();
}

retryBtn.addEventListener('click', () => location.reload());

function gameLoop() {
  if (!gameRunning || gameOver) return;

  // Фон
  ctx.fillStyle = '#6998f0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  moveBirds();
  checkCollisions();
  moveSignal();
  checkArrival();

  // Отрисовка птиц
  birds.forEach(b => {
    if (birdImage.complete && birdImage.naturalWidth !== 0) {
      ctx.drawImage(birdImage, b.x, b.y, b.width, b.height);
    } else {
      ctx.fillStyle = '#888';
      ctx.fillRect(b.x, b.y, b.width, b.height);
    }
  });

  // Курьер
  if (courierImage.complete && courierImage.naturalWidth !== 0) {
    ctx.drawImage(courierImage, courier.x, courier.y, courier.width, courier.height);
  } else {
    ctx.fillStyle = '#ddd';
    ctx.fillRect(courier.x, courier.y, courier.width, courier.height);
  }

  // Сигнал
  if (signalImage.complete && signalImage.naturalWidth !== 0) {
    ctx.drawImage(signalImage, signal.x, signal.y, signal.width, signal.height);
  } else {
    ctx.fillStyle = signal.color;
    ctx.fillRect(signal.x, signal.y, signal.width, signal.height);
  }

  ctx.fillStyle = 'black';
  ctx.font = '20px Arial';
  ctx.fillText('Поражений: ' + hits + ' / ' + maxHits, 10, 20);
  ctx.fillText('Долететь до курьера', 10, 50);

  requestAnimationFrame(gameLoop);
}

function moveBirds() {
  birds.forEach(bird => {
    bird.x += bird.speedX;
    bird.y += bird.speedY;
    if (bird.x < 0 || bird.x + bird.width > canvas.width) bird.speedX *= -1;
    if (bird.y < 0 || bird.y + bird.height > canvas.height) bird.speedY *= -1;
  });
}

function checkCollisions() {
  for (let bird of birds) {
    if (
      signal.x < bird.x + bird.width &&
      signal.x + signal.width > bird.x &&
      signal.y < bird.y + bird.height &&
      signal.y + signal.height > bird.y
    ) {
      hits++;
      if (hits >= maxHits) {
        gameOver = true;
        showLoseScreen();
        return;
      }
    }
  }
}

function moveSignal() {
  if (keys['ArrowUp']) signal.y -= signal.speed;
  if (keys['ArrowDown']) signal.y += signal.speed;
  if (keys['ArrowLeft']) signal.x -= signal.speed;
  if (keys['ArrowRight']) signal.x += signal.speed;

  // Ограничения границ
  signal.x = Math.max(0, Math.min(canvas.width - signal.width, signal.x));
  signal.y = Math.max(0, Math.min(canvas.height - signal.height, signal.y));
}

function checkArrival() {
  if (
    signal.x < courier.x + courier.width &&
    signal.x + signal.width > courier.x &&
    signal.y < courier.y + courier.height &&
    signal.y + signal.height > courier.y
  ) {
    if (!gameOver && hits < maxHits) {
      gameOver = true;
      showWinScreen();
    }
  }
}

function showWinScreen() {
  gameRunning = false;
  winScreen.style.display = 'flex';
}

function showLoseScreen() {
  gameRunning = false;
  loseScreen.style.display = 'flex';
}
  </script>
</body>
</html>
