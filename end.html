
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Видео</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    #videoWrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      max-width: 90%;
      border-radius: 8px;
    }

    #soundBtn {
      position: absolute;
      top: 40px;
      padding: 10px 20px;
      font-size: 16px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      z-index: 20;
    }
    #soundBtn:hover { background: #555; }
  </style>
</head>
<body>

<button id="soundBtn">🔊 Включить звук</button>

<div id="videoWrapper">
  <video id="introVideo" src="video/1(1).mp4" autoplay muted playsinline></video>
</div>

<script>
  const video = document.getElementById('introVideo');
  const soundBtn = document.getElementById('soundBtn');

  soundBtn.addEventListener('click', () => {
    video.muted = false;
    soundBtn.style.display = 'none';
    video.play().catch(e => console.log('Звук заблокирован:', e));
  });
</script>

</body>
</html>
