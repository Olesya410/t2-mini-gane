<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Memory Match</title>
<style>
  body { margin:0; background:linear-gradient(135deg,#ffeef5,#fff8f0); color:#333; font-family:'Segoe UI',Tahoma,sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; min-height:100vh; justify-content:center; }
  #ui { display:flex; gap:20px; align-items:center; margin-bottom:24px; padding:14px 28px; background:rgba(255,255,255,0.8); border:1px solid rgba(243,33,156,0.3); border-radius:20px; backdrop-filter:blur(10px); font-size:16px; box-shadow:0 4px 15px rgba(243,33,156,0.1); }
  .stat { text-shadow:0 0 4px rgba(243,33,156,0.4); min-width:110px; text-align:center; font-weight:600; color:#d61a9b; }
  button { background:#fff; color:#d61a9b; border:2px solid #d61a9b; padding:10px 22px; font-size:15px; cursor:pointer; border-radius:50px; transition:all 0.2s; font-family:monospace; box-shadow:0 0 0 0 rgba(243,33,156,0.3); }
  button:hover:not(:disabled) { background:#d61a9b; color:#fff; transform:scale(1.05); box-shadow:0 0 15px rgba(243,33,156,0.5); }
  button:disabled { opacity:0.5; cursor:not-allowed; filter:grayscale(1); }
  #board { display:grid; grid-template-columns:repeat(6,100px); grid-template-rows:repeat(4,100px); gap:12px; margin:0 auto; }
  .card { width:100px; height:100px; perspective:600px; cursor:pointer; }
  .card-inner { width:100%; height:100%; position:relative; transition:transform 0.6s cubic-bezier(0.175,0.885,0.32,1.275); transform-style:preserve-3d; }
  .card.flipped .card-inner { transform:rotateY(180deg); }
  .card.matched .card-inner { transform:rotateY(180deg); }
  .card-face { position:absolute; width:100%; height:100%; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:48px; backface-visibility:hidden; box-shadow:0 10px 20px rgba(0,0,0,0.05); }
  .card-front { background:linear-gradient(145deg,#fff,#ffe4f0); border:2px solid rgba(243,33,156,0.4); box-shadow:0 0 15px rgba(243,33,156,0.1) inset; }
  .card-front::after { content:'?'; color:rgba(243,33,156,0.6); font-size:36px; text-shadow:0 0 10px rgba(243,33,156,0.4); font-weight:bold; }
  .card-back { background:linear-gradient(145deg,#fff,#ffe4f0); border:2px solid #d61a9b; transform:rotateY(180deg); box-shadow:0 0 20px rgba(243,33,156,0.2); }
  .card.matched .card-back { border-color:#0f8; box-shadow:0 0 25px rgba(0,248,128,0.4); background:linear-gradient(145deg,#e0ffe0,#d0fcd0); }
  .screen { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); display:none; justify-content:center; align-items:center; flex-direction:column; z-index:100; padding:20px; box-sizing:border-box; backdrop-filter:blur(4px); }
  .screen.show { display:flex; }
  .screen h1 { font-size:44px; margin:0 0 12px 0; color:#d61a9b; text-shadow:0 0 20px rgba(243,33,156,0.3); text-align:center; letter-spacing:2px; font-weight:700; }
  .screen p { font-size:18px; color:#555; max-width:520px; text-align:center; line-height:1.6; margin-bottom:30px; }
  .screen button { font-size:17px; padding:14px 44px; margin-top:10px; font-weight:bold; }
</style>
</head>
<body>

<div id="ui">
  <div class="stat" id="timerEl">Время: 60</div>
  <div class="stat" id="movesEl">Ходов: 0</div>
  <div class="stat" id="pairsEl">Пары: 0/12</div>
  <button id="reset">Заново</button>
  <div class="stat" id="msgEl" style="min-width:140px;"></div>
</div>

<div id="board"></div>

<div id="startScreen" class="screen show">
  <h1>ПОРТАЛ ПАМЯТИ</h1>
  <p>24 карточки, 12 пар символов.<br>Открой две — если совпали, пара остаётся.<br>Найди все пары за 60 секунд.</p>
  <button id="startBtn">Начать</button>
</div>

<div id="winScreen" class="screen">
  <h1>ТЫ МОЛОДЕЦ!</h1>
  <p>Все пары найдены!<br>Возвращаемся в лабиринт...</p>
  <button id="backBtn">Вернуться в лабиринт</button>
</div>

<div id="loseScreen" class="screen">
  <h1>ВРЕМЯ ВЫШЛО</h1>
  <p>Попробуй снова.</p>
  <button id="retryBtn">Ещё раз</button>
</div>

<script>
const board = document.getElementById('board');
const timerEl = document.getElementById('timerEl');
const movesEl = document.getElementById('movesEl');
const pairsEl = document.getElementById('pairsEl');
const msgEl = document.getElementById('msgEl');
const resetBtn = document.getElementById('reset');
const winScreen = document.getElementById('winScreen');
const loseScreen = document.getElementById('loseScreen');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const backBtn = document.getElementById('backBtn');
const retryBtn = document.getElementById('retryBtn');

const SYMBOLS = ['\u2B50','\u2728','\u2604','\u2665','\u2660','\u2663','\u2666','\u2744','\u2600','\u2601','\u2602','\u2603'];

let cards = [], firstCard = null, secondCard = null, lock = false;
let moves = 0, pairs = 0, timeLeft = 60, timerInterval, gameActive = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function buildBoard() {
  board.innerHTML = '';
  cards = [];
  const deck = [...SYMBOLS, ...SYMBOLS];
  shuffle(deck);
  deck.forEach(sym => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.symbol = sym;
    const inner = document.createElement('div');
    inner.className = 'card-inner';
    const front = document.createElement('div');
    front.className = 'card-face card-front';
    const back = document.createElement('div');
    back.className = 'card-face card-back';
    back.textContent = sym;
    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);
    board.appendChild(card);
    cards.push(card);
    card.addEventListener('click', () => onCardClick(card));
  });
}

function onCardClick(card) {
  if (!gameActive || lock) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (firstCard && secondCard) return;
  card.classList.add('flipped');
  if (!firstCard) { firstCard = card; return; }
  secondCard = card;
  moves++;
  movesEl.textContent = 'Ходов: ' + moves;
  lock = true;
  if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
    setTimeout(() => {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      firstCard = null; secondCard = null; lock = false;
      pairs++;
      pairsEl.textContent = 'Пары: ' + pairs + '/12';
      msgEl.textContent = '';
      if (pairs === 12) winGame();
    }, 400);
  } else {
    setTimeout(() => {
      firstCard.classList.remove('flipped');
      secondCard.classList.remove('flipped');
      firstCard = null; secondCard = null; lock = false;
    }, 800);
    msgEl.textContent = 'Не совпало!'; msgEl.style.color = '#d61a9b';
    setTimeout(() => { msgEl.textContent = ''; }, 800);
  }
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!gameActive) return;
    timeLeft--;
    timerEl.textContent = 'Время: ' + timeLeft;
    if (timeLeft <= 0) { gameActive = false; clearInterval(timerInterval); loseScreen.classList.add('show'); }
  }, 1000);
}

function startGame() {
  moves = 0; pairs = 0; timeLeft = 60; gameActive = true;
  movesEl.textContent = 'Ходов: 0';
  pairsEl.textContent = 'Пары: 0/12';
  timerEl.textContent = 'Время: 60';
  msgEl.textContent = '';
  winScreen.classList.remove('show');
  loseScreen.classList.remove('show');
  buildBoard();
  startTimer();
}

function winGame() {
  gameActive = false;
  clearInterval(timerInterval);
  const score = Math.max(0, timeLeft * 10 - moves * 3);
  msgEl.innerHTML = 'Победа! Очки: ' + score;
  msgEl.style.color = '#0f8';
  setTimeout(() => { winScreen.classList.add('show'); }, 500);
}

startBtn.addEventListener('click', () => { startScreen.classList.remove('show'); startGame(); });
resetBtn.addEventListener('click', startGame);
backBtn.addEventListener('click', () => { location.href = 'index.html'; });
retryBtn.addEventListener('click', () => { loseScreen.classList.remove('show'); startGame(); });
</script>
</body>
</html>
